<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContentEngine — مولّد محتوى X وتيك توك</title>
  <meta name="description" content="ولّد محتوى احترافي لـ X وتيك توك بالعربي والإنجليزي في ثوانٍ" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ContentEngine" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #f0ede8; font-family: 'Syne', sans-serif; min-height: 100vh; }
    ::selection { background: #ff4d00; color: #fff; }

    .header { border-bottom: 1px solid #1a1a24; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .diamond { width: 28px; height: 28px; background: #ff4d00; transform: rotate(45deg); flex-shrink: 0; }
    .logo-text { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
    .logo-sub { font-size: 10px; color: #555; letter-spacing: 0.1em; }
    .badge { font-size: 10px; color: #ff4d00; font-weight: 700; letter-spacing: 0.1em; border: 1px solid #ff4d00; padding: 3px 8px; }

    .main { max-width: 680px; margin: 0 auto; padding: 36px 20px; }
    .headline { text-align: center; margin-bottom: 36px; }
    .headline h1 { font-size: clamp(26px, 5vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 8px; }
    .headline h1 span { color: #ff4d00; }
    .headline p { color: #555; font-size: 13px; letter-spacing: 0.02em; }

    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #666; margin-bottom: 8px; }
    .section { margin-bottom: 22px; }

    textarea {
      width: 100%; background: #0e0e18; border: 1px solid #1e1e2e; color: #f0ede8;
      padding: 14px 16px; font-size: 15px; font-family: 'Tajawal', sans-serif;
      line-height: 1.7; direction: rtl; resize: none; outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #ff4d00; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 8px 16px; border: 1px solid #2a2a3a; font-size: 12px; font-weight: 600;
      background: transparent; color: #666; cursor: pointer; transition: all 0.2s;
      letter-spacing: 0.05em; font-family: 'Syne', sans-serif;
    }
    .chip:hover { border-color: #ff4d00; color: #ff4d00; }
    .chip.active { background: #ff4d00; color: #fff; border-color: #ff4d00; }

    .btn-wrap { display: flex; justify-content: center; margin: 32px 0; }
    .gen-btn {
      background: #ff4d00; border: none; color: #fff; padding: 14px 40px;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
      letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    }
    .gen-btn:hover:not(:disabled) { background: #e64400; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,77,0,0.35); }
    .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-section { border-top: 1px solid #1a1a24; padding-top: 28px; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

    .tabs { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .tab { padding: 7px 18px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; border: 1px solid transparent; cursor: pointer; color: #555; transition: all 0.2s; }
    .tab.active { border-color: #ff4d00; color: #ff4d00; }

    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .result-label { font-size: 11px; color: #444; font-weight: 700; letter-spacing: 0.1em; }
    .copy-btn {
      background: transparent; border: 1px solid #333; color: #777; padding: 5px 12px;
      font-size: 11px; font-family: 'Syne', sans-serif; font-weight: 600; letter-spacing: 0.08em;
      cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { border-color: #ff4d00; color: #ff4d00; }
    .copy-btn.copied { border-color: #00c853; color: #00c853; }

    .result-box {
      background: #111118; border: 1px solid #1e1e2e; padding: 18px;
      white-space: pre-wrap; line-height: 1.85; font-size: 15px; color: #ddd;
      font-family: 'Tajawal', sans-serif;
    }
    .result-box.en { font-family: 'Syne', sans-serif; font-size: 14px; direction: ltr; text-align: left; }
    .result-box.ar { direction: rtl; text-align: right; }

    .tip { background: rgba(255,77,0,0.07); border-left: 3px solid #ff4d00; padding: 10px 14px; font-size: 13px; color: #ff9966; margin-top: 10px; font-family: 'Tajawal', sans-serif; }
    .tip.ar { direction: rtl; text-align: right; border-left: none; border-right: 3px solid #ff4d00; }

    .error { text-align: center; color: #ff4d00; font-size: 14px; padding: 20px; }

    .loading { display: flex; gap: 6px; align-items: center; }
    .dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    footer { border-top: 1px solid #111; padding: 14px; text-align: center; font-size: 11px; color: #333; letter-spacing: 0.08em; margin-top: 20px; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="diamond"></div>
    <div>
      <div class="logo-text">ContentEngine</div>
      <div class="logo-sub">AR × EN GENERATOR</div>
    </div>
  </div>
  <div class="badge">BETA</div>
</div>

<div class="main">
  <div class="headline">
    <h1>محتوى يشتغل<br><span>بالعربي والإنجليزي</span></h1>
    <p>Generate scroll-stopping content for X & TikTok — instantly</p>
  </div>

  <div class="section">
    <label>TOPIC / الموضوع</label>
    <textarea id="topic" rows="3" placeholder="اكتب موضوعك هنا... e.g. كيف تبني دخل سلبي من الإنترنت"></textarea>
  </div>

  <div class="section">
    <label>CONTENT TYPE</label>
    <div class="chips" id="types">
      <div class="chip active" data-id="tweet">✦ تغريدة</div>
      <div class="chip" data-id="thread">◈ Thread</div>
      <div class="chip" data-id="hook">◉ Hook تيك توك</div>
    </div>
  </div>

  <div class="section">
    <label>TONE / الأسلوب</label>
    <div class="chips" id="tones">
      <div class="chip active" data-id="bold">جريء / Bold</div>
      <div class="chip" data-id="educational">تعليمي / Educational</div>
      <div class="chip" data-id="story">قصة / Story</div>
      <div class="chip" data-id="controversial">استفزازي / Provocative</div>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="gen-btn" id="genBtn" onclick="generate()">⚡ GENERATE CONTENT</button>
  </div>

  <div id="output"></div>
</div>

<footer>CONTENTENGINE — POWERED BY AI</footer>

<script>
  let selectedType = 'tweet';
  let selectedTone = 'bold';

  document.querySelectorAll('#types .chip').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('#types .chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedType = el.dataset.id;
    };
  });

  document.querySelectorAll('#tones .chip').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('#tones .chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedTone = el.dataset.id;
    };
  });

  const typeMap = { tweet: 'Tweet', thread: 'Thread', hook: 'TikTok Hook' };
  const toneMap = { bold: 'Bold', educational: 'Educational', story: 'Story', controversial: 'Provocative' };

  let currentResult = null;
  let activeTab = 'ar';

  async function generate() {
    const topic = document.getElementById('topic').value.trim();
    if (!topic) return;

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    document.getElementById('output').innerHTML = '';

    const prompt = `You are an expert bilingual content creator for X (Twitter) and TikTok targeting Arabic and English-speaking audiences.

Generate content for the topic: "${topic}"
Content type: ${typeMap[selectedType]}
Tone: ${toneMap[selectedTone]}

Rules:
- Arabic content: native Gulf/Saudi style, punchy, relatable
- English content: direct, American internet style
- Tweets: max 280 chars each
- Threads: 7 tweets numbered 1/ 2/ 3/ 4/ 5/ 6/ 7/
- TikTok Hook: opening 3 seconds script only, pattern-interrupt style

Respond ONLY in this exact JSON format (no markdown, no extra text):
{
  "arabic": {
    "content": "the arabic content here",
    "tip": "one short tip in arabic for this content"
  },
  "english": {
    "content": "the english content here",
    "tip": "one short tip in english for this content"
  }
}`;

    try {
      const res = await fetch('https://fragrant-bread-93cc.zonyx1010.workers.dev', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 2500,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const data = await res.json();
      const text = (data.content || []).map(i => i.text || '').join('');
      const clean = text.replace(/```json|```/g, '').trim();
      currentResult = JSON.parse(clean);
      activeTab = 'ar';
      renderResult();
    } catch(e) {
      document.getElementById('output').innerHTML = '<div class="error">حدث خطأ، حاول مجدداً</div>';
    }

    btn.disabled = false;
    btn.innerHTML = '⚡ GENERATE CONTENT';
  }

  function renderResult() {
    if (!currentResult) return;
    const r = currentResult;
    const content = activeTab === 'ar' ? r.arabic?.content : r.english?.content;
    const tip = activeTab === 'ar' ? r.arabic?.tip : r.english?.tip;
    const isAr = activeTab === 'ar';

    document.getElementById('output').innerHTML = `
      <div class="result-section">
        <div class="tabs">
          <div class="tab ${activeTab==='ar'?'active':''}" onclick="switchTab('ar')">العربي</div>
          <div class="tab ${activeTab==='en'?'active':''}" onclick="switchTab('en')">English</div>
        </div>
        <div class="result-header">
          <div class="result-label">OUTPUT</div>
          <button class="copy-btn" id="copyBtn" onclick="copyText()">COPY</button>
        </div>
        <div class="result-box ${isAr?'ar':'en'}">${content || ''}</div>
        ${tip ? `<div class="tip ${isAr?'ar':''}">💡 ${tip}</div>` : ''}
      </div>
    `;
  }

  function switchTab(tab) {
    activeTab = tab;
    renderResult();
  }

  function copyText() {
    if (!currentResult) return;
    const content = activeTab === 'ar' ? currentResult.arabic?.content : currentResult.english?.content;
    navigator.clipboard.writeText(content || '');
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ COPIED';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 2000);
  }

  document.getElementById('topic').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
